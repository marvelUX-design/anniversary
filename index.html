<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Us, Always</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="nav">
<a class="logo" href="#home">OUR STORY</a>
<nav id="links">
<a href="#home">Home</a>
<a href="#letters">Love Letters</a><a href="#anniversary">Anniversary</a>
</nav>
<span class="heart" aria-hidden="true">♥</span>
<button id="menuBtn" aria-label="Open menu" aria-expanded="false">☰</button>
</header>

<section id="home" class="hero">
<video id="heroVid" src="assets/videos/hero.mp4" poster="assets/images/hero-poster.jpg" autoplay muted loop playsinline preload="metadata"></video>
<div class="shade"></div>
<div class="hero-text">
<small>AN ORIGINAL LOVE STORY</small>
<h1 id="hTitle"></h1>
<p id="hDesc"></p>
<div class="btns">
<button id="play" class="b w">▶ Play Our Story</button>
<button id="info" class="b g">ⓘ More Info</button>
</div>
</div>
</section>

<main id="rows"></main>

<section id="anniversary">
<h2>Another Year of Loving You</h2>
<p id="since"></p>
<p id="count" class="big"></p>
<p id="next"></p>
<p id="aMsg"></p>
<button id="surprise" class="b w">Open Your Surprise</button>
</section>

<div id="modal" hidden role="dialog" aria-modal="true" aria-label="Details">
<div class="box">
<button id="close" aria-label="Close">✕</button>
<div id="media"></div>
<div class="body"><h3 id="mTitle"></h3><em id="mDate"></em><p id="mText"></p></div>
<button id="prev" class="nv" aria-label="Previous">‹</button>
<button id="nextBtn" class="nv" aria-label="Next">›</button>
</div>
</div>
<script src="script.js"></script>
</body>
</html>
